# sms-auth: App + PostgreSQL + Redis 통합 실행
#
# 사용법:
#   1) .env.example을 .env로 복사 후 값 채우기 (cp .env.example .env)
#   2) docker compose up -d --build
#
# 로컬 개발: .env의 값들을 기본 예시 그대로 사용해도 즉시 기동된다.
# 운영 환경: .env(또는 CI/CD 시크릿)에 실제 DB_PASSWORD/REDIS_PASSWORD/SOLAPI_* 등을
#            채워 넣어 동일한 파일로 배포한다. db 서비스의 포트 매핑(5432)은
#            운영에서는 외부 노출을 막기 위해 제거하는 것을 권장한다(아래 주석 참고).

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sms-auth:${APP_VERSION:-latest}
    container_name: sms-auth-app
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: 8080

      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-sms_auth}
      DB_USERNAME: ${POSTGRES_USER:-sms_auth}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 설정하세요}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-2}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_SSL_ENABLED: "false"
      REDIS_TIMEOUT_MS: ${REDIS_TIMEOUT_MS:-3000}

      SMS_SENDER_PROVIDER: ${SMS_SENDER_PROVIDER:-dev}
      SMS_FROM_NUMBER: ${SMS_FROM_NUMBER:-}
      SOLAPI_API_KEY: ${SOLAPI_API_KEY:-}
      SOLAPI_API_SECRET: ${SOLAPI_API_SECRET:-}
      SOLAPI_BASE_URL: ${SOLAPI_BASE_URL:-https://api.solapi.com}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - sms-auth-net

  db:
    image: postgres:16-alpine
    container_name: sms-auth-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sms_auth}
      POSTGRES_USER: ${POSTGRES_USER:-sms_auth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 설정하세요}
    # 로컬에서 DB 클라이언트로 직접 접속해 디버깅할 때만 필요. 운영에서는 이 줄을 제거해
    # 컨테이너 네트워크 내부(app -> db)로만 접근을 제한하는 것을 권장한다.
    ports:
      - "${DB_EXPOSED_PORT:-5432}:5432"
    volumes:
      - sms-auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sms-auth-net

  redis:
    image: redis:7-alpine
    container_name: sms-auth-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    # REDIS_PASSWORD가 비어 있으면(로컬 기본값) 무인증으로, 값이 있으면(운영) requirepass로 기동한다.
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then exec redis-server --requirepass "$$REDIS_PASSWORD"; else exec redis-server; fi'
    volumes:
      - sms-auth-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli $${REDIS_PASSWORD:+-a $$REDIS_PASSWORD} --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sms-auth-net

networks:
  sms-auth-net:
    driver: bridge

volumes:
  sms-auth-db-data:
  sms-auth-redis-data:

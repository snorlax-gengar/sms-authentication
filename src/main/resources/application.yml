spring:
  application:
    name: sms-auth

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # DB 초기화 스크립트(schema.sql) 자동 실행 여부.
  # 기본값은 미실행 — H2(local)는 Hibernate ddl-auto: update로 스키마를 자동 생성하므로
  # PostgreSQL 문법의 schema.sql이 실수로 H2에 적용되는 것을 방지한다.
  # prod 프로필에서만 명시적으로 always 로 재정의한다.
  sql:
    init:
      mode: never

server:
  port: ${SERVER_PORT:8080}

sms:
  rate-limit:
    minute-max: 3
    daily-max: 5
  verification:
    ttl-seconds: 180
    max-attempts: 5   # 인증번호당 최대 검증 시도 횟수 (초과 시 인증번호 폐기)
  sender:
    provider: ${SMS_SENDER_PROVIDER:dev}   # dev(기본, 무료) | mock | solapi(유료)
    from-number: ${SMS_FROM_NUMBER:}
    timeout-seconds: 3
    solapi:
      api-key: ${SOLAPI_API_KEY:}
      api-secret: ${SOLAPI_API_SECRET:}
      base-url: ${SOLAPI_BASE_URL:https://api.solapi.com}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

# 헬스체크 — 컨테이너 오케스트레이터(Docker/K8s)가 사용한다.
# liveness는 프로세스 생존, readiness는 DB/Redis 연결까지 포함해 판정한다.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never          # 외부에 인프라 상세 정보를 노출하지 않는다
      probes:
        enabled: true              # /actuator/health/liveness, /readiness 활성화
  health:
    redis:
      enabled: true
    db:
      enabled: true
